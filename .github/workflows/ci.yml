name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    working-directory: recommendation-service
jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: recommendation-service/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q --maxfail=1
        env:
          SERVER_HOST: "0.0.0.0"
          SERVER_PORT: "8081"
          DATABASE_URL: "postgresql+psycopg://dummy:dummy@localhost:5432/dummy"
      - run: pip install pip-audit && pip-audit
  docker:
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: recommendation-service
          load: true
          tags: rec:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Ensure no .env baked in image
        run: docker run --rm --entrypoint sh rec:ci -c '! test -e /app/.env'
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: rec:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true